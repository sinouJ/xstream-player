<svg width="512" height="512" viewBox="0 0 89 89" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip">
      <rect width="89" height="89" rx="21" ry="21"></rect>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="89" y2="89" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07071a"></stop>
      <stop offset="100%" stop-color="#12123a"></stop>
    </linearGradient>
    <linearGradient id="play" x1="15" y1="44.5" x2="56" y2="44.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="1"></stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="arm" x1="0" y1="44.5" x2="89" y2="44.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.92"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0.69"></stop>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="89" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="white" stop-opacity="0.035"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="89" height="89" fill="url(#bg)"></rect>
    <rect x="0" y="27" width="89" height="35" rx="3" fill="url(#shimmer)"></rect>
    
    <path d="M 15,86 L 15,3 L 53,41.5 Q 58,44.5 53,47.5 L 15,86 Z" fill="url(#play)" filter="url(#glow)"></path>
    
    <line x1="-2" y1="-2" x2="91" y2="91" stroke="url(#arm)" stroke-width="18"></line>
    <line x1="91" y1="-2" x2="-2" y2="91" stroke="url(#arm)" stroke-width="18"></line>
  </g>
</svg>